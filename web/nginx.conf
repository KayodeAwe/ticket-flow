server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser talks to one origin. nginx forwards /api to the API container, so the app
    # never makes a cross-origin request and there is no CORS preflight in the hot path — the
    # API's CORS_ORIGIN setting exists for the Vite dev server only.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything under /assets, so those files can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: any other path is a React route, not a missing file. Without this a
    # browser refresh on /tickets/abc123 returns nginx's 404. index.html itself must never be
    # cached, or a deploy stays invisible until people hard-refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
